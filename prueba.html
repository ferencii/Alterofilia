<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Detector de Dedos</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#container{
    position:relative;
    width:100vw;
    height:100vh;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

canvas{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

#counter{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    color:#00ff88;
    padding:12px 24px;
    border-radius:15px;
    font-size:32px;
    font-weight:bold;
    z-index:100;
}

#status{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    color:white;
    padding:8px 16px;
    border-radius:10px;
    z-index:100;
}
</style>
</head>
<body>

<div id="container">

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="counter">0 dedos</div>
    <div id="status">Iniciando cámara...</div>

</div>

<script type="module">

import {
    HandLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const counter = document.getElementById("counter");
const statusBox = document.getElementById("status");

let handLandmarker;

const connections = [
[0,1],[1,2],[2,3],[3,4],
[0,5],[5,6],[6,7],[7,8],
[5,9],[9,10],[10,11],[11,12],
[9,13],[13,14],[14,15],[15,16],
[13,17],[17,18],[18,19],[19,20],
[0,17]
];

async function startCamera() {

    const stream = await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:"user",
            width:{ideal:640},
            height:{ideal:480}
        },
        audio:false
    });

    video.srcObject = stream;

    await new Promise(resolve=>{
        video.onloadedmetadata = resolve;
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    statusBox.textContent = "Cámara iniciada";
}

async function initMediaPipe() {

    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
            },
            runningMode:"VIDEO",
            numHands:1,
            minHandDetectionConfidence:0.7,
            minHandPresenceConfidence:0.7,
            minTrackingConfidence:0.7
        }
    );
}

function drawHand(landmarks){

    ctx.lineWidth = 4;
    ctx.strokeStyle = "#00ff88";

    for(const pair of connections){

        const p1 = landmarks[pair[0]];
        const p2 = landmarks[pair[1]];

        ctx.beginPath();
        ctx.moveTo(
            canvas.width - (p1.x * canvas.width),
            p1.y * canvas.height
        );

        ctx.lineTo(
            canvas.width - (p2.x * canvas.width),
            p2.y * canvas.height
        );

        ctx.stroke();
    }

    for(const point of landmarks){

        const x = canvas.width - (point.x * canvas.width);
        const y = point.y * canvas.height;

        ctx.beginPath();
        ctx.arc(x,y,6,0,Math.PI*2);
        ctx.fillStyle = "#ff4444";
        ctx.fill();
    }
}

function countFingers(landmarks){

    let count = 0;

    if(landmarks[8].y < landmarks[6].y) count++;
    if(landmarks[12].y < landmarks[10].y) count++;
    if(landmarks[16].y < landmarks[14].y) count++;
    if(landmarks[20].y < landmarks[18].y) count++;

    const thumbOpen =
        landmarks[4].x < landmarks[3].x;

    if(thumbOpen) count++;

    return count;
}

function render(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const now = performance.now();

    const result =
        handLandmarker.detectForVideo(
            video,
            now
        );

    if(result.landmarks.length){

        const hand = result.landmarks[0];

        drawHand(hand);

        const fingers =
            countFingers(hand);

        counter.textContent =
            fingers + " dedo" +
            (fingers===1 ? "" : "s");

    }else{

        counter.textContent =
            "Sin mano";
    }

    requestAnimationFrame(render);
}

async function start(){

    try{

        await startCamera();

        statusBox.textContent =
            "Cargando IA...";

        await initMediaPipe();

        statusBox.textContent =
            "Detección activa";

        render();

    }catch(err){

        console.error(err);

        statusBox.textContent =
            "Error: " + err.message;
    }
}

start();

</script>

</body>
</html>
